<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کۆمپانیای زوار الروضة</title>
<link rel="icon" href="assets/logo-simple.png">
<style>
:root{--g:#d4a937;--d:#0b3d3a;--l:#fffaf0}
*{box-sizing:border-box;font-family:Tahoma,"Noto Naskh Arabic",sans-serif}
body{margin:0;min-height:100vh;background:#0b3d3a url(assets/bg.png) center/cover fixed;color:#222}
.hide{display:none!important}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:var(--l);border:3px solid var(--g);border-radius:16px;padding:16px;margin:10px 0}
.logo{display:block;margin:auto;max-width:200px;width:50%}
h2{color:var(--d);text-align:center;margin:10px 0 6px}
input,select,textarea{width:100%;padding:9px;border:1px solid #bba;border-radius:8px;font-size:16px;background:#fff}
input[readonly]{background:#eee}
label{font-size:13px;color:var(--d);font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.btn{background:linear-gradient(#f5dc7c,var(--g));border:2px solid #a67c1c;border-radius:12px;padding:12px;font-size:16px;font-weight:bold;color:#2a1d00;cursor:pointer}
.btn.r{background:#b33;color:#fff;border-color:#700}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bar .btn{flex:1;min-width:110px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd div{flex:1;font-size:13px;display:grid;gap:4px}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.mod .card{max-width:560px;width:100%;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px;align-items:end}
.toast{position:fixed;top:10px;left:10px;background:var(--d);color:#fff;padding:10px 14px;border-radius:10px;border:2px solid var(--g);z-index:20;max-width:80vw}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}td,th{border:1px solid #cba;padding:6px}
video,canvas.pv{width:100%;border-radius:10px;background:#000}
#ph{width:90px;height:110px;object-fit:cover;border:2px solid var(--g);border-radius:8px}
/* menu on the supplied design */
.mi{position:relative;aspect-ratio:16/9;max-width:1200px;margin:auto;background:url(assets/menu.png) center/100% 100%;container-type:inline-size;border-radius:12px}
.mi button{position:absolute;width:15.6%;height:8.2%;background:none;border:0;font-weight:bold;color:#0b3d3a;font-size:1.55cqw;cursor:pointer}
.mg{display:none;gap:12px;grid-template-columns:1fr 1fr;margin-top:12px}.mg .btn{padding:22px 6px}
@media(max-width:760px){.mi{display:none}.mg{display:grid}}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;position:relative;width:210mm;height:297mm;background:url(assets/receipt.jpg) center/100% 100%;font-size:17px}
#pa .t{position:absolute;top:78mm;right:20mm;left:50mm;line-height:2.2}#pa img{position:absolute;top:78mm;left:20mm;width:28mm}}
</style>
</head>
<body>
<div id="toast"></div>

<div id="login" class="wrap" style="max-width:420px;padding-top:6vh"><div class="card">
 <img class="logo" src="assets/logo-full.png" alt="">
 <label>ناوی بەکارهێنەر</label><input id="lu">
 <label>وشەی نهێنی</label><input id="lp" type="password" onkeydown="if(event.key==='Enter')doLogin()">
 <div class="bar"><button class="btn" onclick="doLogin()">چوونە ژوورەوە</button><button class="btn r" onclick="window.close();toast('دەتوانیت پەنجەرەکە دابخەیت')">دەرچوون</button></div>
</div></div>

<div id="menu" class="wrap hide"><div id="mi" class="mi"></div><div id="mg" class="mg"></div></div>

<div id="reg" class="wrap hide"><div class="card">
 <div class="hd">
  <div><span>بەرواری تۆمارکردن: <b id="rd"></b></span><span>فەرمانبەر: <b id="re"></b></span></div>
  <img src="assets/logo-text.png" style="width:130px" alt="">
  <div><span>کاتی تۆمارکردن: <b id="rt"></b></span><span>ژمارەی پسوڵە: <b id="rn"></b></span></div>
 </div>
 <div class="grid" style="margin-top:10px">
  <div><label>ناوی چواری گەشتیار</label><input id="f_name"></div>
  <div><label>ژمارەی پاسەپۆرت</label><input id="f_pass"></div>
  <div><label>جۆری گەشت</label><select id="f_trip"><option>حەج<option>عومرە</select></div>
  <div><label>جۆری گواستنەوە</label><select id="f_tr"><option>فڕۆکە<option>پاس</select></div>
  <div><label>جۆری خزمەتگوزاری</label><select id="f_srv"><option>بەخزمەتگوزاریەوە<option>بێ خزمەتگوزاری</select></div>
  <div><label>بەشی شوێنی مانەوە</label><div class="row"><select id="f_acc" onchange="accSync()"><option>هۆتێل<option>إعتکاف</select><input id="f_hotel" placeholder="ناوی هۆتێل"></div></div>
  <div><label>ژمارەی مۆبایل</label><input id="f_tel" inputmode="tel"></div>
  <div><label>بەرواری گەشت</label><input id="f_date" type="date"></div>
  <div><label>ناوی بریکار</label><input id="f_agent"></div>
  <div><label>جۆری دراو</label><select id="f_cur" onchange="curSync()"><option value="$">دۆلار ($)<option value="د.ع">دینار (د.ع)</select></div>
  <div><label>نرخی دیاریکراو</label><select id="f_preset" onchange="preset()"></select></div>
  <div><label>نرخی گەشت <span class="cs">$</span></label><input class="num" id="f_price" inputmode="numeric"></div>
  <div><label>بڕی وەرگیراو <span class="cs">$</span></label><input class="num" id="f_paid" inputmode="numeric"></div>
  <div><label>بڕی ماوە <span class="cs">$</span></label><input id="f_rem" readonly></div>
  <div style="grid-column:1/-1"><label>تێبینی</label><textarea id="f_note" rows="2"></textarea></div>
  <div><img id="ph" class="hide" alt=""></div>
 </div>
 <div class="bar">
  <button class="btn" onclick="camModal()">وێنەگرتن</button>
  <button class="btn" onclick="scanModal()">بەشی سکان و NFC</button>
 </div>
 <div class="bar">
  <button class="btn r" onclick="go('menu')">دەرچوون بۆ بەشی مینو</button>
  <button class="btn" onclick="fill(null)">تۆماری نوێ</button>
  <button class="btn" onclick="save()">هەڵگرتن</button>
  <button class="btn" onclick="doPrint()">چاپکردن</button>
  <button class="btn r" onclick="askDel()">سڕینەوە</button>
  <button class="btn" onclick="openSearch()">گەڕان</button>
 </div>
</div></div>

<div id="fin" class="wrap hide"><div class="card"><h2>بەشی دارایی</h2><div id="finBody"></div><button class="btn r" style="margin-top:10px" onclick="go('menu')">گەڕانەوە</button></div></div>

<div id="adm" class="wrap hide"><div class="card"><h2>بەشی کارگێڕی — نرخەکان</h2>
 <div class="grid"><div><label>ناوی نرخ / جۆری گەشت</label><input id="pn"></div><div><label>بڕ</label><input class="num" id="pa_" inputmode="numeric"></div>
 <div><label>جۆری دراو</label><select id="pc"><option value="$">دۆلار ($)<option value="د.ع">دینار (د.ع)</select></div></div>
 <div class="bar"><button class="btn" onclick="addPrice()">زیادکردن</button></div><div id="plist"></div>
 <button class="btn r" style="margin-top:10px" onclick="go('menu')">گەڕانەوە</button></div></div>

<div id="set" class="wrap hide"><div class="card"><h2>زیادکردنی ئەکاونت</h2>
 <div class="grid"><div><label>ناوی بەکارهێنەر</label><input id="nu"></div><div><label>وشەی نهێنی</label><input id="np" type="password"></div>
 <div><label>ڕۆڵ</label><select id="nr"><option value="emp">فەرمانبەر<option value="admin">بەڕێوەبەر</select></div></div>
 <div class="bar"><button class="btn" onclick="addUser()">زیادکردن</button></div><div id="users"></div>
 <h2>فەرمانبەران و مووچە</h2>
 <div class="grid"><div><label>ناوی فەرمانبەر</label><input id="sn"></div><div><label>مووچە</label><input class="num" id="sa" inputmode="numeric"></div>
 <div><label>جۆری دراو</label><select id="sc"><option value="$">دۆلار ($)<option value="د.ع">دینار (د.ع)</select></div></div>
 <div class="bar"><button class="btn" onclick="addStaff()">زیادکردن</button></div><div id="slist"></div>
 <h2>گۆڕینی وشەی نهێنی خۆم</h2><div class="row"><input id="mp" type="password"><button class="btn" onclick="chPass()">گۆڕین</button></div>
 <h2>ئاگادارکردنەوەکان</h2><div id="notes"></div>
 <h2>تۆماری هەموو حەرەکەکان</h2><div style="overflow:auto"><table id="log"></table></div>
 <button class="btn r" style="margin-top:10px" onclick="go('menu')">گەڕانەوە</button></div></div>

<div id="mod" class="mod hide"><div class="card" id="modBody"></div></div>
<div id="pa"><div class="t" id="paT"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=sessionStorage.t||'',me=null,S={recs:[],seq:0,prices:[],users:[],staff:[],log:[],notes:[]},cur=null,hits=[],hi=-1,pend=null,es=null,scr='login';
async function api(p,b){
 const o={headers:{'x-token':tok,'Content-Type':'application/json'}};if(b){o.method='POST';o.body=JSON.stringify(b)}
 const r=await fetch('/api/'+p,o);
 if(r.status===401&&tok){out();throw 0}
 const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.e||'هەڵە');throw 0}return j;
}
function toast(m){const t=$('toast');t.className='toast';t.textContent=m;clearTimeout(t.h);t.h=setTimeout(()=>t.className='',3000)}
function modal(h,close=true){$('modBody').innerHTML=h+(close?'<div class="bar"><button class="btn" onclick="closeM()">داخستن</button></div>':'');$('mod').classList.remove('hide')}
function closeM(){stopCam();$('mod').classList.add('hide')}

/* auth */
async function doLogin(){
 tok='';const j=await api('login',{u:$('lu').value.trim(),p:$('lp').value});
 tok=j.token;sessionStorage.t=tok;sessionStorage.u=j.u;sessionStorage.r=j.role;me=j;await boot();
}
async function boot(){
 await refresh();
 if(es)es.close();es=new EventSource('/api/events?t='+tok);
 es.addEventListener('sync',async()=>{await refresh();if(scr==='fin')renderFin();if(scr==='set')renderSet();if(scr==='adm')renderAdm()});
 es.addEventListener('note',e=>{const m=JSON.parse(e.data).m;toast(m);if(window.Notification&&Notification.permission==='granted')new Notification('زوار الروضة',{body:m})});
 if(me.role==='admin'&&window.Notification&&Notification.permission==='default')Notification.requestPermission();
 renderMenu();go('menu');
}
async function refresh(){Object.assign(S,await api('data'))}
function out(){tok='';sessionStorage.removeItem('t');me=null;if(es)es.close();$('lp').value='';go('login')}
function logout(){out()}
if(tok&&sessionStorage.u){me={u:sessionStorage.u,role:sessionStorage.r};boot().catch(()=>{})}

/* navigation */
const secs=['login','menu','reg','fin','adm','set'];
function go(s,restricted){
 if(restricted&&me.role!=='admin')return modal('<p style="text-align:center;font-weight:bold">ناتوانیت ئەم بەشە بکەیتەوە سنوردارە تەنها بۆ بەڕێوەبەر ڕێگەپێدراوە</p>');
 scr=s;secs.forEach(x=>$(x).classList.toggle('hide',x!==s));
 if(s==='reg')fill(null);if(s==='fin')renderFin();if(s==='set')renderSet();if(s==='adm')renderAdm();
}
function renderMenu(){
 const it=[['go("reg")','بەشی تۆمارکردن'],['openSearch()','بەشی گەڕان'],['go("fin",1)','بەشی دارایی'],['go("adm",1)','بەشی کارگێڕی'],['go("set",1)','بەشی ڕێکخستنەکان'],['logout()','بەشی دەرچوون']];
 const pos=[[62.6,53.4],[42.1,53.4],[21.7,53.4],[62.6,76.8],[42.1,76.8],[21.7,76.8]];
 $('mi').innerHTML=it.map((x,i)=>`<button style="left:${pos[i][0]}%;top:${pos[i][1]}%" onclick='${x[0]}'>${x[1]}</button>`).join('');
 $('mg').innerHTML='<img class="logo" style="grid-column:1/-1" src="assets/logo-full.png" alt="">'+it.map(x=>`<button class="btn" onclick='${x[0]}'>${x[1]}</button>`).join('');
}

/* numbers & currency */
const num=v=>+String(v||'').replace(/,/g,'')||0,fmt=n=>n.toLocaleString('en-US');
document.querySelectorAll('.num').forEach(i=>i.addEventListener('input',()=>{const d=i.value.replace(/\D/g,'');i.value=d?fmt(+d):'';calc()}));
function calc(){$('f_rem').value=fmt(num($('f_price').value)-num($('f_paid').value))}
function curSync(){document.querySelectorAll('.cs').forEach(s=>s.textContent=$('f_cur').value)}
function accSync(){const h=$('f_acc').value==='هۆتێل';$('f_hotel').disabled=!h;$('f_hotel').classList.toggle('hide',!h);if(!h)$('f_hotel').value=''}
function preset(){const p=S.prices[$('f_preset').value];if(!p)return;$('f_cur').value=p.cur;curSync();$('f_price').value=fmt(num(p.amount));calc()}

/* registration */
const F=['name','pass','trip','tr','srv','acc','hotel','tel','date','agent','cur','price','paid','note'];
function showPh(){const i=$('ph');const s=pend||(cur&&cur.photo?'/api/photo?id='+cur.id+'&t='+tok+'&v='+Date.now():'');i.classList.toggle('hide',!s);if(s)i.src=s}
function fill(r){
 F.forEach(k=>$('f_'+k).value=r?r[k]:($('f_'+k).tagName==='SELECT'?$('f_'+k).options[0].value:''));
 $('f_preset').innerHTML='<option value="">—</option>'+S.prices.map((p,i)=>`<option value="${i}">${esc(p.name)} (${esc(p.amount)} ${esc(p.cur)})</option>`).join('');
 cur=r||null;pend=null;accSync();curSync();calc();showPh();
 const n=new Date();
 $('rd').textContent=r?r.d:n.toLocaleDateString('en-CA');$('rt').textContent=r?r.t:n.toLocaleTimeString('en-GB');$('re').textContent=r?r.by:me.u;$('rn').textContent=r?r.no:S.seq+1;
}
async function save(){
 const r={};F.forEach(k=>r[k]=$('f_'+k).value);
 if(!r.name.trim()||!r.pass.trim())return toast('ناو و ژمارەی پاسەپۆرت پێویستە');
 if(cur)r.id=cur.id;
 const j=await api('rec',{rec:r});cur=j;
 if(pend){await api('photo',{id:j.id,data:pend});j.photo=true;pend=null}
 $('rn').textContent=j.no;$('rd').textContent=j.d;$('rt').textContent=j.t;$('re').textContent=j.by;showPh();toast('هەڵگیرا');
}
function askDel(){
 if(!cur)return toast('هیچ تۆمارێک هەڵنەبژێردراوە');
 modal('<label>وشەی نهێنیی خۆت بنووسە بۆ دڵنیابوونەوە لە سڕینەوە</label><input id="dp" type="password"><div class="bar"><button class="btn r" onclick="doDel()">سڕینەوە</button></div>');
}
async function doDel(){await api('del',{id:cur.id,password:$('dp').value});closeM();fill(null);toast('سڕایەوە')}
function doPrint(){
 if(!cur)return toast('سەرەتا هەڵیبگرە');
 const r=cur,c=esc(r.cur);
 $('paT').innerHTML=`پسوڵەی ژمارە: ${r.no} — بەروار: ${r.d} ${r.t}<br>ناو: ${esc(r.name)}<br>پاسەپۆرت: ${esc(r.pass)} — مۆبایل: ${esc(r.tel)}<br>گەشت: ${esc(r.trip)} / ${esc(r.tr)} / ${esc(r.srv)}<br>شوێنی مانەوە: ${esc(r.acc)} ${esc(r.hotel)}<br>بەرواری گەشت: ${esc(r.date)} — بریکار: ${esc(r.agent)}<br>نرخ: ${esc(r.price)} ${c} — وەرگیراو: ${esc(r.paid)} ${c} — ماوە: ${fmt(num(r.price)-num(r.paid))} ${c}<br>تێبینی: ${esc(r.note)}<br>فەرمانبەر: ${esc(r.by)}`+(r.photo?`<img src="/api/photo?id=${r.id}&t=${tok}">`:'');
 setTimeout(()=>window.print(),300);
}

/* search */
function openSearch(){
 modal(`<h2>گەڕان</h2><div class="grid"><div><label>ژمارەی پاسەپۆرت</label><input id="s_pass"></div><div><label>ناوی چواری گەشتیار</label><input id="s_name"></div><div><label>ژمارەی مۆبایل</label><input id="s_tel"></div><div><label>لە بەرواری</label><input id="s_from" type="date"></div><div><label>تاکو بەرواری</label><input id="s_to" type="date"></div></div>
 <div class="bar"><button class="btn" onclick="runSearch()">گەڕان</button></div>
 <div class="bar"><button class="btn" onclick="nav('first')">یەکەم پسوڵە</button><button class="btn" onclick="nav(-1)">پێش</button><button class="btn" onclick="nav(1)">پاش</button><button class="btn" onclick="nav('last')">کۆتا پسوڵە</button></div><div id="sres"></div>`);
 runSearch();
}
function runSearch(){
 const g=i=>$(i).value.trim(),p=g('s_pass'),n=g('s_name'),t=g('s_tel'),a=g('s_from'),b=g('s_to');
 hits=S.recs.filter(r=>(!p||r.pass.includes(p))&&(!n||r.name.includes(n))&&(!t||r.tel.includes(t))&&(!a||r.d>=a)&&(!b||r.d<=b));
 $('sres').innerHTML=hits.length?'<table>'+hits.map((r,i)=>`<tr onclick="show(${i})" style="cursor:pointer"><td>${r.no}</td><td>${esc(r.name)}</td><td>${esc(r.pass)}</td><td>${r.d}</td></tr>`).join('')+'</table>':'<p>هیچ ئەنجامێک نەدۆزرایەوە</p>';
}
function show(i){hi=i;closeM();go('reg');fill(hits[i])}
function nav(x){
 if(!hits.length)return toast('هیچ ئەنجامێک نییە');
 hi=x==='first'?0:x==='last'?hits.length-1:Math.min(hits.length-1,Math.max(0,(hi<0?0:hi)+x));show(hi);
}

/* camera + white background */
let stream=null,seg=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function loadJs(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function camModal(){
 modal(`<h2>وێنەگرتن</h2><video id="cv" autoplay playsinline muted></video><canvas id="cc" class="pv hide"></canvas>
 <label><input type="checkbox" id="rmbg" checked style="width:auto"> لابردنی پاشبنەما (سپی)</label>
 <div class="bar"><button class="btn" id="cb" onclick="snap()">وێنەگرتن</button><button class="btn hide" id="ca" onclick="accept()">پەسەندکردن</button><button class="btn" onclick="document.getElementById('cf').click()">هەڵبژاردنی وێنە</button></div>
 <input type="file" id="cf" accept="image/*" capture="user" class="hide" onchange="fromFile(this.files[0])">`);
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});$('cv').srcObject=stream}catch{toast('کامێرا کار ناکات — وێنەیەک هەڵبژێرە')}
}
async function process(src,w,h){
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(src,0,0,w,h);
 let out=cv;
 if($('rmbg').checked){
  try{
   toast('...چاوەڕێبە');
   if(!seg){await loadJs('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js');seg=new SelfieSegmentation({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/'+f});seg.setOptions({modelSelection:0})}
   out=await new Promise(async ok=>{seg.onResults(r=>{const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');x.drawImage(r.segmentationMask,0,0,w,h);x.globalCompositeOperation='source-in';x.drawImage(r.image,0,0,w,h);x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);ok(o)});await seg.send({image:cv})});
  }catch{toast('لابردنی پاشبنەما سەرکەوتوو نەبوو (ئینتەرنێت پێویستە)')}
 }
 const p=$('cc');p.width=w;p.height=h;p.getContext('2d').drawImage(out,0,0);p.classList.remove('hide');$('cv').classList.add('hide');$('ca').classList.remove('hide');
}
function snap(){const v=$('cv');if(!v.videoWidth)return toast('کامێرا ئامادە نییە');process(v,v.videoWidth,v.videoHeight)}
function fromFile(f){if(!f)return;const i=new Image();i.onload=()=>process(i,i.width,i.height);i.src=URL.createObjectURL(f)}
function accept(){pend=$('cc').toDataURL('image/jpeg',.9);closeM();showPh();toast('وێنەکە ئامادەیە — هەڵیبگرە')}

/* scanner (MRZ OCR) + NFC */
function scanModal(){
 modal(`<h2>بەشی سکان و NFC</h2>
 <p>وێنەی پاسەپۆرت یان کارتی ناسنامە (لە سکانەر یان کامێرا) هەڵبژێرە:</p>
 <input type="file" accept="image/*" onchange="ocr(this.files[0])"><div id="ocrs"></div>
 <div class="bar"><button class="btn" onclick="nfc()">خوێندنەوەی NFC</button></div><div id="nfcs"></div>`);
}
async function ocr(f){
 if(!f)return;$('ocrs').textContent='...دەخوێنرێتەوە';
 try{
  if(!window.Tesseract)await loadJs('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const {data}=await Tesseract.recognize(f,'eng');
  const L=data.text.split('\n').map(l=>l.replace(/\s/g,'').toUpperCase()).filter(l=>l.length>=28&&l.includes('<'));
  if(L.length<2)return $('ocrs').textContent='MRZ نەدۆزرایەوە — وێنەیەکی ڕوونتر هەڵبژێرە';
  let name='',no='';
  if(L.length>=3&&L[L.length-3].length<=32){no=L[L.length-3].slice(5,14);const p=L[L.length-1].split('<<');name=((p[1]||'').replace(/</g,' ')+' '+p[0].replace(/</g,' ')).trim()}
  else{const a=L[L.length-2],b=L[L.length-1],p=a.slice(5).split('<<');name=((p[1]||'').replace(/</g,' ')+' '+p[0].replace(/</g,' ')).trim();no=b.slice(0,9)}
  no=no.replace(/</g,'');$('f_name').value=name;$('f_pass').value=no;closeM();toast('زانیارییەکان پڕکرانەوە — بیانپشکنە');
 }catch{$('ocrs').textContent='خوێندنەوە سەرنەکەوت (ئینتەرنێت پێویستە)'}
}
async function nfc(){
 if(!('NDEFReader' in window))return $('nfcs').textContent='ئەم ئامێرە/براوزەرە NFC پشتگیری ناکات (Chrome ی ئەندرۆید پێویستە)';
 try{const r=new NDEFReader();await r.scan();$('nfcs').textContent='...کارتەکە لە NFC نزیک بکەرەوە';
  r.onreading=e=>{let t='';for(const x of e.message.records)if(x.recordType==='text')t+=new TextDecoder(x.encoding||'utf-8').decode(x.data)+' ';
   $('nfcs').innerHTML=`ژمارەی زنجیرەیی: <b>${esc(e.serialNumber)}</b><br>${esc(t)}<div class="bar"><button class="btn" onclick="document.getElementById('f_pass').value='${esc(t.trim()||e.serialNumber)}';closeM()">بنووسە لە خانەی پاسەپۆرت</button></div>`}
 }catch{$('nfcs').textContent='NFC چالاک نەکرا'}
}

/* finance */
function renderFin(){
 const s={};S.recs.forEach(r=>{const o=s[r.cur]=s[r.cur]||{p:0,g:0};o.p+=num(r.price);o.g+=num(r.paid)});
 const sal={};(S.staff||[]).forEach(x=>sal[x.cur]=(sal[x.cur]||0)+num(x.salary));
 $('finBody').innerHTML='<table><tr><th>دراو</th><th>کۆی نرخ</th><th>وەرگیراو</th><th>ماوە</th><th>مووچەکان</th><th>قازانج (وەرگیراو − مووچە)</th></tr>'+Object.entries(s).map(([c,o])=>`<tr><td>${esc(c)}</td><td>${fmt(o.p)}</td><td>${fmt(o.g)}</td><td>${fmt(o.p-o.g)}</td><td>${fmt(sal[c]||0)}</td><td>${fmt(o.g-(sal[c]||0))}</td></tr>`).join('')+'</table>';
}

/* admin: prices */
function renderAdm(){$('plist').innerHTML='<table>'+S.prices.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${esc(p.amount)} ${esc(p.cur)}</td><td><button class="btn r" onclick="rm('prices',${i})">سڕینەوە</button></td></tr>`).join('')+'</table>'}
async function addPrice(){const n=$('pn').value.trim();if(!n||!$('pa_').value)return toast('هەموو خانەکان پڕبکەرەوە');await api('price',{name:n,amount:String(num($('pa_').value)),cur:$('pc').value});$('pn').value=$('pa_').value='';await refresh();renderAdm()}
async function rm(kind,i){await api('remove',{kind,i});await refresh();kind==='prices'?renderAdm():renderSet()}

/* settings */
function renderSet(){
 $('users').innerHTML='<table>'+(S.users||[]).map(u=>`<tr><td>${esc(u.u)}</td><td>${u.role==='admin'?'بەڕێوەبەر':'فەرمانبەر'}</td></tr>`).join('')+'</table>';
 $('slist').innerHTML='<table>'+(S.staff||[]).map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${fmt(num(x.salary))} ${esc(x.cur)}</td><td><button class="btn r" onclick="rm('staff',${i})">سڕینەوە</button></td></tr>`).join('')+'</table>';
 $('notes').innerHTML='<table>'+(S.notes||[]).map(n=>`<tr><td>${n.t}</td><td>${esc(n.m)}</td></tr>`).join('')+'</table>';
 $('log').innerHTML='<tr><th>کات</th><th>بەکارهێنەر</th><th>کردار</th><th>وردەکاری</th></tr>'+(S.log||[]).map(l=>`<tr><td>${l.t}</td><td>${esc(l.u)}</td><td>${esc(l.a)}</td><td>${esc(l.d)}</td></tr>`).join('');
}
async function addUser(){await api('user',{u:$('nu').value.trim(),p:$('np').value,role:$('nr').value});$('nu').value=$('np').value='';await refresh();renderSet();toast('ئەکاونتەکە زیادکرا')}
async function addStaff(){const n=$('sn').value.trim();if(!n)return toast('ناو بنووسە');await api('staff',{name:n,amount:String(num($('sa').value)),cur:$('sc').value});$('sn').value=$('sa').value='';await refresh();renderSet()}
async function chPass(){if(!$('mp').value)return;await api('pass',{p:$('mp').value});$('mp').value='';toast('وشەی نهێنی گۆڕدرا')}
</script>
